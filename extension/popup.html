<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyperMedia Helper Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      width: 375px;
      background: #0c0c14;
      color: #E2E8F0;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f1f2e;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #00E5FF;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-site {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: #004d40;
      color: #00E676;
      font-weight: bold;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: #94A3B8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-primary:hover { background: #00B0FF; }
    .btn-success {
      background: #00796b;
      color: #ffffff;
      border-color: #004d40;
    }
    .btn-success:hover { background: #00897b; }
    .btn-secondary {
      background: #1a1a26;
      color: #E2E8F0;
      border: 1px solid #2d2d42;
    }
    .btn-secondary:hover { background: #252538; border-color: #00E5FF; }
    .btn-danger {
      background: #7f1d1d;
      color: #ff8080;
      border: 1px solid #991b1b;
    }
    .btn-danger:hover { background: #991b1b; }
    
    .quick-chips {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .chip {
      flex: 1;
      padding: 5px 0;
      background: #161622;
      border: 1px solid #2d2d42;
      border-radius: 4px;
      color: #00E5FF;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip:hover, .chip.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #00E5FF;
    }
    
    .batch-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .limit-input {
      width: 90px;
      background: #161622;
      border: 1px solid #2d2d42;
      border-radius: 6px;
      color: #00E5FF;
      font-weight: bold;
      padding: 6px 10px;
      font-size: 13px;
      text-align: center;
    }
    .limit-input:focus { outline: none; border-color: #00E5FF; }
    
    .random-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #12121c;
      border: 1px solid #252538;
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .random-box label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #a7ffeb;
    }
    
    .result-box {
      width: 100%;
      height: 90px;
      background: #12121c;
      border: 1px solid #252538;
      border-radius: 6px;
      color: #a7ffeb;
      font-family: 'Consolas', monospace;
      font-size: 11px;
      padding: 8px;
      resize: none;
      margin-bottom: 10px;
      white-space: pre;
    }
    .status-msg {
      font-size: 12px;
      color: #00E5FF;
      margin-bottom: 8px;
      min-height: 18px;
      font-weight: 500;
    }
    .footer {
      border-top: 1px solid #1f1f2e;
      padding-top: 8px;
      font-size: 11px;
      color: #64748B;
      display: flex;
      justify-content: space-between;
    }
    .footer a { color: #00E5FF; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>⚡ HyperMedia Grabber Pro</span>
    </div>
    <div id="siteBadge" class="badge-site">Đang nhận diện...</div>
  </div>

  <div class="section-title">1. Tải Lẻ (Video Đang Xem)</div>
  <button id="btnCopySingle" class="btn btn-primary">
    <span>🎬 Copy Link Video Này (1080p)</span>
  </button>

  <div class="section-title" style="margin-top: 12px;">
    <span>2. Tải Hàng Loạt (Auto-Scroll)</span>
    <span style="color:#00E676; font-size:10px;">Anti-Bot Random</span>
  </div>
  
  <div class="quick-chips">
    <div class="chip active" data-val="20">20 Video</div>
    <div class="chip" data-val="50">50 Video</div>
    <div class="chip" data-val="100">100 Video</div>
    <div class="chip" data-val="0">Tất Cả</div>
  </div>

  <div class="random-box">
    <label>
      <input type="checkbox" id="chkHumanRandom" checked>
      <span>Mô phỏng lướt ngẫu nhiên người thật</span>
    </label>
    <span style="color:#00E5FF; font-size:11px;">(Random Delay & Step)</span>
  </div>

  <div class="batch-controls">
    <input type="number" id="inpLimit" class="limit-input" value="20" min="0" max="500" title="0 = Quét toàn bộ">
    <button id="btnStartBatch" class="btn btn-success" style="margin-bottom:0; flex:1;">
      <span>⚡ Bắt Đầu Cuộn Random</span>
    </button>
  </div>
  <button id="btnStopBatch" class="btn btn-danger" style="display:none;">
    <span>⏹ Dừng Cuộn Trang</span>
  </button>

  <div id="statusMsg" class="status-msg">Sẵn sàng trích xuất link.</div>
  <textarea id="txtResults" class="result-box" placeholder="Danh sách link video sẽ xuất hiện tại đây..." readonly></textarea>

  <button id="btnCopyAll" class="btn btn-secondary" style="display:none;">
    <span>📋 Copy Toàn Bộ Vào Clipboard</span>
  </button>

  <div class="footer">
    <span>Tác giả: <a href="https://github.com/NguyenThanhDuy42124" target="_blank">Nguyễn Thanh Duy</a></span>
    <span>Zalo: <b>0334674017</b></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
